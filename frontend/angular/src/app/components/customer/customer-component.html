<p-drawer
  [(visible)]="display"
  position="right"
  [transitionOptions]="'500ms cubic-bezier(0, 0, 0.2, 1)'"
  styleClass="p-sidebar-lg !w-full md:!w-80 lg:!w-[30rem]"
>
  <app-manage-customer-components
    [customer]="customer"
    [operation]="operation"
    (submit)="save($event)"
    (cancel)="cancel()"
  >

  </app-manage-customer-components>
</p-drawer>

<div class = "flex align-items-stretch" style="height: 99vh;">
  <div class="flex flex-column align-items-stretch border-right-1 col-2 border-gray-200">
    <app-menu-bar>

    </app-menu-bar>
  </div>
  <div class="flex flex-column flex-grow-1">
    <div>
     <app-header-bar-component>

     </app-header-bar-component>
    </div>
    <div class="main-container p-3">
      <button
      pButton
      icon="pi pi-plus"
      label="Create cutomer"
      class="p-button-success"
      (click)="createCustomer()"
      >
      </button>
      <div>
      <div class="flex justify-content-center align-items-center flex-wrap gap-5 mt-4">
        <app-customer-card-component
          *ngFor="let customer of customers; let index = index"
          [customer] = "customer"
          [customerIndex] = "index"
          (delete)="deleteCustomer($event)"
          (update)="updateCustomer($event)"
        >
        </app-customer-card-component>
      </div>
      </div>
    </div>
  </div>
</div>

<p-confirmDialog
  header="Confirmation"
  icon="pi pi-exclamation-triangle"
  acceptLabel="Delete"
  acceptButtonStyleClass="p-button-danger"
  acceptIcon="pi pi-trash"
  rejectLabel="Cancel"
>

</p-confirmDialog>

<p-toast position="bottom-center" />
