<div class="flex" style="height: 100vh">
  <div class="col-6 m-3 flex flex-column justify-content-center">
    <div class="m-auto">
      <div class="text-center">
        <p-avatar
          image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
          styleClass="mr-2"
          size="xlarge"
          shape="circle"
        ></p-avatar>
        <h1>Sign your account</h1>
        @if(errorMsg != ''){
          <p-message
            severity="error"
            icon="pi pi-times-circle"
            styleClass="mb-2"
          >
            {{errorMsg}}
          </p-message>
        }
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input
          [(ngModel)]="authenticationRequest.username"
          id="email"
          pInputText
          placeholder="Enter Username"
          type="email"
          class="w-full"
        >
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input
          [(ngModel)]="authenticationRequest.password"
          id="password"
          pInputText
          placeholder="Enter Password"
          type="password"
          class="w-full"
        >
      </div>
      <button
        pButton
        label="Login"
        class="w-full p-button-secondary"
        (click)="login()"
      ></button>
      <button
        pButton
        label="Don't have an acoount? Sign Up"
        class="p-button-link text-left pl-0"
        style="color: blue;"
        (click)="register()"
      ></button>
    </div>
  </div>
  <div class="col-6 flex flex-column justify-content-center align-items-center right-container">
    <h1>
      <a href="#" target="_blank">Enrol Now</a>
    </h1>
    <img class="background p-6 pt-0"
         src="https://user-images.githubusercontent.com/40702606/215539167-d7006790-b880-4929-83fb-c43fa74f429e.png" alt="">
  </div>
</div>
