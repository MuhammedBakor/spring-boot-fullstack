server:
  port: 8080
  error:
    include-message: always

cors:
  allowed-origins: "*"
  allowed-methods: "*"
  allowed-headers: "*"
  exposed-headers: "*"

aws:
  region: eu-west-1
  s3:
    buckets:
      customer: put-the-exact-buket-name-in-aws-s3

management:
  endpoints:
    web:
      exposure:
        include: "health, info"

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/customer #${SPRING_DATASOURCE_URL}
    username: moody #${SPRING_DATASOURCE_USERNAME}
    password: password #${SPRING_DATASOURCE_PASSWORD} #
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true
  main:
    web-application-type: servlet