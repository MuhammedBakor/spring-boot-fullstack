name: CD - Deploy Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - backend/**

jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: moody
          POSTGRES_PASSWORD: password
          POSTGRES_DB: customer
        ports:
          - 5432:5432
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Slack Commit message and sha
        run: >
          curl -X POST -H "Content-type: application/json"
          --data '{"text":":github: Commit pushed → <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}> - ${{ github.event.head_commit.message }}"}'
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Message - Triggered
        run: >
          curl -X POST -H "Content-type: application/json"
          --data '{"text":":rocket: Backend deployment started..."}'
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Set build number
        id: build-number
        run: echo "BUILD_NUMBER=$(date '+%Y-%m-%d-%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Send Slack Message - Build Started
        run: >
          curl -X POST -H "Content-type: application/json"
          --data '{"text":":maven: Building Docker images with Jib..."}'
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Build & Push Docker Images with Jib (latest and number tag)
        run: |
          mvn -ntp -B compile jib:build \
            -Dimage=${{ secrets.DOCKERHUB_USERNAME }}/customer-management-api:${{ steps.build-number.outputs.BUILD_NUMBER }}
          
          mvn -ntp -B compile jib:build \
            -Dimage=${{ secrets.DOCKERHUB_USERNAME }}/customer-management-api:latest

      - name: Send Slack Message - Images Pushed
        run: >
          curl -X POST -H "Content-type: application/json"
          --data '{"text":":docker: Pushed tags to Docker Hub:\n• `${{ steps.build-number.outputs.BUILD_NUMBER }}`\n• `latest`"}'
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Deploy to Render
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      - name: Send Slack Message - Deployed
        run: >
          curl -X POST -H "Content-type: application/json"
          --data '{"text":":white_check_mark: Deployment to Render completed!"}'
          ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Message - Final Job Status
        if: always()
        run: >
          curl -X POST -H "Content-type: application/json"
          --data "{\"text\":\":clipboard: Final Job Status: *${{ job.status }}*\"}"
          ${{ secrets.SLACK_WEBHOOK_URL }}
